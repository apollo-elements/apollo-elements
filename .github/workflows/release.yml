name: Release

on:
  push:
    branches:
      - main
      - next

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release:
    # Prevents changesets action from creating a PR on forks
    if: github.repository == 'apollo-elements/apollo-elements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install -g npm@latest

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.7'

      - name: Install packages
        run: npm ci

      - name: Codegen
        run: npm run build:codegen

      - name: Lint
        run: npm run lint

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Test
        run: |
          npm test -- --coverage
          npm test --prefix packages/create

      - name: Publish Code Coverage
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CLEAN_MVN_REPO }}
        if: env.CC_TEST_REPORTER_ID != null
        uses: paambaati/codeclimate-action@v9

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: ${{ github.ref_name == 'next' && 'npm run release:prerelease' || '' }}
          createGithubReleases: ${{ github.ref_name == 'main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
